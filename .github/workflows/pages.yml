name: Deploy PWA to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'logs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/logic.test.js tests/ios.test.js tests/sync.test.js tests/sync-devices.test.js

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/docs _site/src _site/tests
          cp index.html app.js store.js sync.js manifest.webmanifest sw.js icon.svg icon-192.png icon-512.png README.md _site/
          cp src/logic.js _site/src/logic.js
          cp src/search.js _site/src/search.js
          cp src/diag.js _site/src/diag.js
          cp docs/USER_GUIDE.html _site/docs/USER_GUIDE.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
